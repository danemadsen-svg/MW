name: Wardrobe
options:
  bundleIdPrefix: com.danemadsen
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
packages:
  WardrobeCore:
    path: Packages/WardrobeCore
  StableDiffusion:
    url: https://github.com/apple/ml-stable-diffusion
    from: 1.1.1
  ZIPFoundation:
    url: https://github.com/weichsel/ZIPFoundation
    from: 0.9.20
fileGroups:
  - Wardrobe/Resources/Wardrobe.storekit
  - docs
targets:
  Wardrobe:
    type: application
    platform: iOS
    sources:
      - path: Wardrobe
        # Test-only StoreKit configuration; referenced by the scheme, not shipped in the app.
        excludes:
          - "**/*.storekit"
    dependencies:
      - package: WardrobeCore
      - package: StableDiffusion
        product: StableDiffusion
      - package: ZIPFoundation
    entitlements:
      path: Wardrobe/Wardrobe.entitlements
      properties:
        # Image generation peaks above 2 GB; this raises the app's memory limit where the device allows.
        com.apple.developer.kernel.increased-memory-limit: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.danemadsen.wardrobe
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Wardrobe
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSCameraUsageDescription: Take photos of your clothes and accessories to add them to your closet. Photos stay on this iPhone.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        CODE_SIGN_STYLE: Automatic
  WardrobeTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - WardrobeTests
    dependencies:
      - target: Wardrobe
      # Already linked into the host app; linking it again would duplicate its symbols.
      - package: WardrobeCore
        link: false
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.danemadsen.wardrobe.tests
schemes:
  Wardrobe:
    build:
      targets:
        Wardrobe: all
        WardrobeTests: [test]
    run:
      config: Debug
      storeKitConfiguration: Wardrobe/Resources/Wardrobe.storekit
    test:
      config: Debug
      targets:
        - WardrobeTests
        - package: WardrobeCore/WardrobeCoreTests
